<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wallet — Crypto Exchange</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="avatar-btn" href="/" title="Profile">A</a>
  <span class="brand">AVENRA</span>
  <button class="total-balance" id="total-balance" title="Total balance">
    <span class="tb-dot"></span>
    <b id="total-balance-value">0.00</b><span class="tb-unit">USDT</span>
  </button>
</header>

<main>
  <div class="uid-row">
    <button class="uid-chip" id="uid-chip" title="Click to copy Telegram ID">Telegram ID: <b id="uid-value">…</b></button>
    <span style="color:var(--muted);font-size:12px;">Tap ID to copy</span>
  </div>

  <div class="wallet-total">
    <div>
      <div style="color:var(--muted);font-size:13px;">Total balance (estimated)</div>
      <b id="wallet-total-value">$0.00</b>
    </div>
    <div style="color:var(--muted);font-size:12px;">Values use live Binance prices</div>
  </div>

  <div class="panel" style="margin:12px 12px 0;">
    <h3>Balances</h3>
    <table class="wallet-table">
      <thead><tr><th>Asset</th><th>Balance</th><th>Price</th><th>Value (USDT)</th></tr></thead>
      <tbody id="wallet-body"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
  <p class="note">Balances are credited by the admin.</p>
</main>

<!-- Fixed bottom nav (mobile): Home / Spot / Futures / Wallet -->
<nav class="bottom-nav" aria-label="Sections">
  <a class="bn-item" href="/">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Home</span>
  </a>
  <a class="bn-item" href="/?mode=spot">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v3M7 15v5M5 7h4v8H5z"/><path d="M17 3v3M17 14v7M15 6h4v8h-4z"/></svg>
    <span>Spot</span>
  </a>
  <a class="bn-item" href="/?mode=futures">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
    <span>Futures</span>
  </a>
  <a class="bn-item active" href="/wallet.html">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>
    <span>Wallet</span>
  </a>
  <a class="bn-item hidden" href="/?view=admin" id="nav-admin">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9.4-8 11-4.5-1.6-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>
    <span>Admin</span>
  </a>
</nav>

<div id="toast"></div>

<script src="/js/common.js"></script>
<script src="/js/wallet.js"></script>
</body>
</html>
